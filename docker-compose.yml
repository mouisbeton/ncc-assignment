version: '3.9'

services:
  health-check-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-check-service
    ports:
      - "${SERVICE_PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - health-check-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  health-check-network:
    driver: bridge